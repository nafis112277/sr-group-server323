name: Sync local-ai to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'local-ai/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push local-ai folder to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git subtree split --prefix=local-ai -b hf-deploy

         git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/code-with-hossain/sr-group-local-ai

          git push --force space hf-deploy:main
